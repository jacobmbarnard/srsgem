#! YAML

---
################################################################################
# Source Search Paths
################################################################################

# File paths relative to project directory

markdown_search_folder: '.' # project directory 
markdown_search_is_recursive: false

yaml_mappings_search_folder: '.' # project directory 
yaml_mappings_search_is_recursive: false






################################################################################
# PlantUML Flags
################################################################################

# Whether to build PlantUML documents.
build_plantuml: true

# Determines whether the PlantUML output SVG files are
# kept with the source `.puml` files and placed in the
# output folder, or only placed in the output folder.
# 
# true: svg output is kept in both locations
# false: svg output is only kept in the output location
keep_copy_of_plantuml_svg_with_source: true


# The command or executable to use in order to
# run the correct build of pandoc.
pandoc_command: 'pandoc'


################################################################################
# Stable IDs (Traceability)
#
# Last-used counters and verbatim header bindings per namespace (BR, TS, ADR,
# etc.) are stored in .srsgem/ids.json (see SRSIdManager). Created on `srsgem init`.
#
# `srsgem ids assign` is the explicit command.
# During `srsgem build`:
# - If `auto_assign_ids_on_build: true`, missing IDs at the configured levels
#   are automatically assigned (side effect).
# - If `warn_on_missing_ids: true`, warnings are emitted for key headers
#   lacking stable IDs.
################################################################################
